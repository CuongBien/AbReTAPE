[project]
name = "abretape"
version = "0.1.0"
description = "Absorption-Resistant Task-Aware Perceptual Encoding (AR-TAPE) in Split Learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "torchaudio>=2.11.0",
    "matplotlib>=3.11.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "lpips>=0.1.4",
    "tqdm>=4.66.5",
    "ipykernel>=7.0.0",
    "numpy>=2.0.0",
    "scipy>=1.17.0",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu130"]
